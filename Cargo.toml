[package]
name        = "lplus"
description = "L+ Connect — unofficial Linux client for OnePlus/OPPO phones"
version     = "0.1.0"
edition     = "2024"
license     = "MIT"
# Shipped as a product binary, never published to crates.io; also lets
# cargo-deny's allow-wildcard-paths exempt our internal path deps.
publish     = false

# Workspace layout: `ipc/` is the backend contract (the control-plane both the daemon and
# external clients speak); `lplusd/` serves it (phone stack +
# loopback backend); `ui/` (parked) once consumed it. This root crate
# is only the wiring: the CLI and the product binary that starts the
# daemon and serves the contract server. `proto/` is the separate phone wire.
[workspace]
members = [".", "proto", "ipc", "lplusd"]
# UI wiring parked: "ui" (GPUI window member) joins the workspace again
# together with the `gui` feature below.

# Shared versions/features; `lplus` and `protocol` both reference these.
[workspace.dependencies]
anyhow     = { version = "1", default-features = false, features = ["std"] }
# cross-platform machine identity: machine-uid (OS-native machine id)
# and whoami (hostname); both OSV-clean, actively maintained (see member
# Cargo.toml notes).
machine-uid = { version = "0.6", default-features = false }
prost       = { version = "0.14", default-features = false, features = ["derive", "std"] }
prost-build = { version = "0.14", default-features = false }
prost-types = { version = "0.14", default-features = false, features = ["std"] }
rtsp-types  = { version = "0.1", default-features = false }
serde       = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json  = { version = "1", default-features = false, features = ["std"] }
strum       = { version = "0.28", default-features = false, features = ["std", "derive"] }
whoami      = { version = "2", default-features = false }
thiserror   = { version = "2", default-features = false, features = ["std"] }

[features]
default = []
# GPUI desktop window: links the `lplus-ui` member. Parked with the ui/
# member until the daemon lane ships.
# gui = ["dep:lplus-ui"]

[dependencies]
anyhow             = { workspace = true }
clap               = { version = "4", default-features = false, features = ["std", "derive", "help", "error-context"] }
# daemon↔ui contract member (cli_tests drive its queue/dispatcher)
lplusd             = { path = "lplusd" }
# lplus-ui         = { path = "ui", optional = true }
hex                = { version = "0.4", default-features = false, features = ["std"] }
serde_json         = { workspace = true }
tokio              = { version = "1", default-features = false, features = ["rt-multi-thread", "time", "sync", "net", "io-util", "macros", "process"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "env-filter", "fmt", "registry", "smallvec"] }
tracing            = { version = "0.1", default-features = false, features = ["std"] }
tracing-appender   = { version = "0.2", default-features = false }
