[package]
name        = "lplus"
description = "L+ Connect — unofficial Linux client for OnePlus/OPPO phones"
version     = "0.1.0"
edition     = "2024"
license     = "MIT"
# Shipped as a product binary, never published to crates.io; also lets
# cargo-deny's allow-wildcard-paths exempt our internal `protocol` path dep.
publish     = false

[workspace]
members = [".", "protocol"]

# Shared versions/features; `lplus` and `protocol` both reference these.
[workspace.dependencies]
anyhow     = { version = "1", default-features = false, features = ["std"] }
prost      = { version = "0.14", default-features = false, features = ["derive", "std"] }
rtsp-types = { version = "0.1", default-features = false }
serde      = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
strum      = { version = "0.28", default-features = false, features = ["std", "derive"] }
thiserror  = { version = "2", default-features = false, features = ["std"] }

[features]
default = ["gui"]
# GPUI desktop window (merged linux-client-ui). Headless builds:
# `cargo build --no-default-features` skips the wgpu/wayland stack.
gui = ["dep:gpui", "dep:gpui_platform", "dep:fast_qr", "dep:lucide-static-svg", "dep:image"]

# All dependencies opt out of default features; only what the code
# actually uses is enabled (verified by cargo check + the test suite).
[dependencies]
aes                = { version = "0.9", default-features = false }
aes-gcm            = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
anyhow             = { workspace = true }
base64             = { version = "0.23", default-features = false, features = ["std"] }
bluer              = { version = "0.17", default-features = false, features = ["bluetoothd"] }
cbc                = { version = "0.2", default-features = false, features = ["alloc", "block-padding"] }
clap               = { version = "4", default-features = false, features = ["std", "derive", "help", "error-context"] }
# cross-platform base dirs (XDG config / %APPDATA% / Application Support)
# for the per-user state files; hand-rolling the per-OS fallback rules is
# the bug-prone part (OSV: no advisories).
directories        = { version = "6", default-features = false }
futures            = { version = "0.3", default-features = false, features = ["std", "async-await"] }
hex                = { version = "0.4", default-features = false, features = ["std"] }
hkdf               = { version = "0.13", default-features = false }
hmac               = { version = "0.13", default-features = false }
# phone↔PC wire contract (workspace member `protocol/`)
protocol           = { path = "protocol" }
p256               = { version = "0.14", default-features = false, features = ["ecdh", "ecdsa", "precomputed-tables", "std"] }
prost              = { workspace = true }
rand               = { version = "0.10", default-features = false, features = ["thread_rng"] }
serde              = { workspace = true }
serde_json         = { workspace = true }
sha2               = { version = "0.11", default-features = false, features = ["alloc"] }
strum              = { workspace = true }
tokio              = { version = "1", default-features = false, features = ["rt-multi-thread", "time", "sync", "net", "io-util", "macros", "process"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "env-filter", "fmt", "registry", "smallvec"] }
tracing            = { version = "0.1", default-features = false, features = ["std"] }
tracing-appender   = { version = "0.2", default-features = false }
# rust-crypto backend (no str0m-aws-lc-rs, no example-server rouille stack
# from the `examples` default). Note: `aws-lc-sys` still links — str0m's
# DTLS crate `dimpl` enables its aws-lc-rs + rcgen defaults unconditionally
# upstream; pruning that needs an upstream feature gate.
str0m              = { version = "0.25", default-features = false, features = ["rust-crypto"] }
str0m-rust-crypto  = { version = "0.7", default-features = false }
# merged GPUI UI (feature `gui`): wayland only (x11 backend unused), no
# windows-manifest; font-kit + image formats are used by the window.
fast_qr            = { version = "0.14", optional = true, default-features = false }
gpui               = { package = "gpui-ce", version = "0.3", optional = true, default-features = false, features = ["font-kit", "wayland", "image-default-formats"] }
gpui_platform      = { package = "gpui_ce_platform", version = "0.3", optional = true, default-features = false, features = ["multithreaded"] }
# JPEG frame decode for the native live preview (same 0.25 series gpui
# already pulls in; jpeg codec only).
image              = { version = "0.25", optional = true, default-features = false, features = ["jpeg"] }
# Lucide icon catalog as embedded official SVG bytes (guaranteed by the
# crate's own tests); svg feature only, no transitive deps.
lucide-static-svg  = { version = "1.70.0", optional = true, default-features = false, features = ["svg"] }

[dev-dependencies]
gpui = { package = "gpui-ce", version = "0.3", default-features = false, features = ["test-support"] }
