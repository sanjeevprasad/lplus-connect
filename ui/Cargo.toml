[package]
name    = "lplus-ui"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish    = false
# GPUI port of the vendored O+ Connect renderer (screens, stores, view
# tree, e2e). Depends only on `lplus-ipc` — never on `lplusd`; the
# merged window gets its in-process dispatcher installed by the wiring
# binary, Attach mode speaks prost `/rpc` to a remote daemon.

[dependencies]
image              = { version = "0.25", default-features = false }
lplus-ipc          = { path = "../ipc" }
prost              = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
strum              = { workspace = true }
tracing            = { version = "0.1", default-features = false, features = ["std"] }
# wayland only (x11 backend unused), no windows-manifest; font-kit +
# image formats are used by the window.
gpui               = { package = "gpui-ce", version = "0.3", default-features = false, features = ["font-kit", "wayland", "image-default-formats"] }
gpui_platform      = { package = "gpui_ce_platform", version = "0.3", default-features = false, features = ["multithreaded"] }
# QR pairing payload rendering (embedded SVG/PNG into the dialog).
fast_qr            = { version = "0.14", default-features = false }
# Lucide icon catalog as embedded official SVG bytes (guaranteed by the
# crate's own tests); svg feature only, no transitive deps.
lucide-static-svg  = { version = "1.70.0", default-features = false, features = ["svg"] }

[dev-dependencies]
gpui = { package = "gpui-ce", version = "0.3", default-features = false, features = ["test-support"] }
# QR param round-trip checks in the ipc/app suites (HeySynergy bean).
base64 = { version = "0.23", default-features = false, features = ["std"] }
proto  = { path = "../proto" }
